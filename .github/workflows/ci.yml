name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the kit against the spec
        run: npm run check
      - name: Drive the demos in Chrome
        run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
